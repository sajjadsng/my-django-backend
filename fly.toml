# fly.toml app configuration file generated for django-auth-api on 2024-01-01T00:00:00Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "django-auth-api"
primary_region = "fra"

[build]

[env]
  DEBUG = "False"
  ALLOWED_HOSTS = ".fly.dev"
  CORS_ALLOW_ALL_ORIGINS = "True"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/swagger/"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256 